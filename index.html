/* ================= Biểu đồ thêm cho báo cáo chiến dịch ================= */
function rpChartsVT(c,A,distRows){
  const byP=distRows.slice().sort((a,b)=>b.posts-a.posts),fb=distRows.reduce((s,x)=>s+x.fb,0),tt=distRows.reduce((s,x)=>s+x.tt,0),cum=cumSeries(c,A.posts);
  mount('rcDist',pal=>cfgBar({labels:byP.map(x=>x.name),sets:[{label:'Facebook',data:byP.map(x=>x.fb),color:'grad'},{label:'TikTok',data:byP.map(x=>x.tt),color:'tt'}],stacked:1,horiz:1,pal}));
  mount('rcPf',pal=>cfgDonut({labels:['Facebook','TikTok'],data:[fb,tt],pal}));
  mount('rcCum',pal=>cfgLine({labels:cum.labels,sets:[{label:'Số bài tích lũy',data:cum.data}],pal}));
  return`<div class="grid2 wide"><section class="panel"><div class="ph"><div><h2>Số bài theo quận, huyện</h2><p class="hint">Tách Facebook và TikTok</p></div></div>${chartBox('rcDist',Math.max(280,byP.length*24+60),'Biểu đồ số bài theo quận huyện')}</section>
  <div style="display:flex;flex-direction:column;gap:18px;min-width:0"><section class="panel"><h2>Tỷ trọng nền tảng</h2>${chartBox('rcPf',220,'Biểu đồ tỷ trọng Facebook và TikTok')}</section><section class="panel"><h2>Số bài tích lũy theo ngày</h2>${chartBox('rcCum',220,'Biểu đồ số bài tích lũy')}</section></div></div>`;
}
function rpChartsReach(distRows){
  const byE=distRows.slice().sort((a,b)=>b.eng-a.eng);
  mount('rcEng',pal=>cfgBar({labels:byE.map(x=>x.name),sets:[{label:'Lượt thích',data:byE.map(x=>x.likes),color:'grad'},{label:'Bình luận',data:byE.map(x=>x.cmts),color:'tt'},{label:'Chia sẻ',data:byE.map(x=>x.shares),color:'dark'}],stacked:1,pal}));
  mount('rcAvg',pal=>cfgBar({labels:distRows.slice().sort((a,b)=>b.avg-a.avg).map(x=>x.name),sets:[{label:'Tương tác mỗi bài',data:distRows.slice().sort((a,b)=>b.avg-a.avg).map(x=>Math.round(x.avg)),color:'grad'}],pal}));
  return`<section class="panel"><div class="ph"><div><h2>Tương tác theo quận, huyện</h2><p class="hint">Lượt thích, bình luận và chia sẻ cộng dồn</p></div></div>${chartBox('rcEng',320,'Biểu đồ tương tác theo quận huyện')}</section>
  <section class="panel"><div class="ph"><div><h2>Tương tác trung bình mỗi bài</h2><p class="hint">Đơn vị nào có bài chất lượng hơn</p></div></div>${chartBox('rcAvg',280,'Biểu đồ tương tác trung bình mỗi bài')}</section>`;
}
function rpChartsBK(A,rows,key){
  const t=grpTot(A),top=rows.filter(x=>x.posts).sort((a,b)=>b[key]-a[key]).slice(0,10);
  mount('rbPf',pal=>cfgDonut({labels:['Facebook','TikTok'],data:[t.fb,t.tt],pal}));
  mount('rbTop',pal=>cfgBar({labels:top.map(x=>x.name),sets:[{label:key==='posts'?'Số bài':'Tương tác',data:top.map(x=>x[key]),color:'grad'}],horiz:1,pal}));
  return`<div class="grid2 wide"><section class="panel"><h2>${key==='posts'?'10 thành viên nhiều bài nhất':'10 thành viên tương tác cao nhất'}</h2>${chartBox('rbTop',300,'Biểu đồ top thành viên')}</section><section class="panel"><h2>Tỷ trọng nền tảng</h2>${chartBox('rbPf',300,'Biểu đồ tỷ trọng nền tảng Booking')}</section></div>`;
}
function rpChartsUnit(A,pr){
  const t=grpTot(A),top=pr.slice().sort((a,b)=>b.posts-a.posts||b.eng-a.eng).slice(0,10);
  mount('ruTop',pal=>cfgBar({labels:top.map(x=>x.name.split(' ').slice(-2).join(' ')),sets:[{label:'Số bài',data:top.map(x=>x.posts),color:'grad'}],horiz:1,pal}));
  mount('ruPf',pal=>cfgDonut({labels:['Facebook','TikTok'],data:[t.fb,t.tt],pal}));
  return`<div class="grid2 wide"><section class="panel"><h2>10 người đăng nhiều nhất trong đơn vị</h2>${chartBox('ruTop',300,'Biểu đồ số bài trong đơn vị')}</section><section class="panel"><h2>Tỷ trọng nền tảng</h2>${chartBox('ruPf',300,'Biểu đồ tỷ trọng nền tảng')}</section></div>`;
}

  sendCamp:()=>{readDraft();const d=ui.camp;if(!d.districts.length&&!d.booking){toast('Chọn ít nhất một quận, huyện hoặc nhóm Booking/Event.');return;}persistCamp();sendDialog('launch',d.id,peopleIn(d.districts).concat(d.booking?allBooking():[]),'[Phát động] '+d.name,launchBody(d,null).replace('anh/chị [Họ tên]','anh/chị').replace('[Hashtag cá nhân]','hashtag cá nhân của anh/chị (VTHN + mã quận huyện + mã nhân viên)'));},
  confirmSend:el=>{const id=el.dataset.id,k=el.dataset.kind;const c=S.campaigns[id];if(k==='launch'&&!c.sentAt){c.sentAt=new Date().toISOString();saveCamp(id);if(ui.camp&&ui.camp.id===id)ui.camp.sentAt=c.sentAt;}
    S.settings.log=(S.settings.log||[]).concat([{camp:id,kind:k,n:+el.dataset.n,at:new Date().toISOString(),by:ui.adminName}]).slice(-200);saveSettings();closeDlg();toast(k==='launch'?'Đã ghi nhận gửi thông báo phát động.':'Đã ghi nhận gửi nhắc nhở.');render();},
  copyText:el=>{const t=el.dataset.t;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Đã sao chép nội dung, hãy dán vào bài đăng.'),()=>openDlg(`<h2>Sao chép thủ công</h2><textarea class="in" rows="6" readonly>${esc(t)}</textarea><div class="acts"><button class="btn pri" data-act="closeDlg">Xong</button></div>`));},
  delCamp:()=>openDlg(`<h2>Xóa chiến dịch này?</h2><p style="margin:0">Toàn bộ bài đăng đã ghi nhận của chiến dịch cũng bị xóa.</p><div class="acts"><button class="btn" data-act="closeDlg">Hủy</button><button class="btn pri" data-act="delCampOk">Xóa chiến dịch</button></div>`),
  delCampOk:()=>{const id=ui.camp.id;delete S.campaigns[id];delete S.posts[id];saveCamp(id);savePosts(id);ui.camp=null;closeDlg();toast('Đã xóa chiến dịch.');render();},
  dTog:el=>{readDraft();const d=ui.camp,v=el.dataset.v;d.districts=d.districts.includes(v)?d.districts.filter(x=>x!==v):d.districts.concat([v]);render();},
  dAll:()=>{readDraft();ui.camp.districts=D.map(d=>d.code);render();},
  dHas:()=>{readDraft();ui.camp.districts=D.filter(d=>(S.people[d.code]||[]).length).map(d=>d.code);render();},
  dNone:()=>{readDraft();ui.camp.districts=[];render();},
  genAI:()=>{readDraft();genAI();},
  useAI:el=>{readDraft();if(ui.camp.banners.length>=10){toast('Mỗi chiến dịch tối đa 10 banner.');return;}ui.camp.banners.push(Object.assign({type:'ai'},ui.ai.results[+el.dataset.i]));render();},
  rmBanner:el=>{readDraft();ui.camp.banners.splice(+el.dataset.i,1);render();},

  dlBannerC:el=>{const c=S.campaigns[el.dataset.id];bannerPng(c.banners[+el.dataset.i],(c.hashtags||[]).join(' '),'banner-'+(+el.dataset.i+1));},
  submitPost:submitPost,
  delMyPost:el=>{const cid=el.dataset.cid;S.posts[cid]=(S.posts[cid]||[]).filter(p=>!(p.id===el.dataset.id&&isMine(p,me())));savePosts(cid);toast('Đã rút bài.');render();},
  editPost:el=>openDlg(editPostForm(findPost(el.dataset.id))),
  savePostEdit:el=>{const p=findPost(el.dataset.id);p.likes=+$('#epL').value||0;p.cmts=+$('#epC').value||0;p.views=+$('#epV').value||0;p.shares=+$('#epS').value||0;savePosts(ui.rp.camp);closeDlg();toast('Đã cập nhật số liệu.');render();},
  delPost:el=>{const c=ui.rp.camp;S.posts[c]=(S.posts[c]||[]).filter(p=>p.id!==el.dataset.id);savePosts(c);toast('Đã xóa bài.');render();},
  simPosts:()=>{const c=S.campaigns[ui.rp.camp];if((S.posts[c.id]||[]).some(p=>p.src!=='manual')){openDlg(`<h2>Tạo lại dữ liệu mô phỏng?</h2><p style="margin:0">Bài mô phỏng và bài nhập từ file sẽ được thay mới. Bài người dùng tự nộp được giữ nguyên.</p><div class="acts"><button class="btn" data-act="closeDlg">Hủy</button><button class="btn pri" data-act="simOk">Tạo dữ liệu mô phỏng</button></div>`);return;}simPosts();},
  simOk:()=>{closeDlg();simPosts();},
  exportReport:exportReport,
  exportMissing:()=>{const c=S.campaigns[ui.rp.camp];const A=campAgg(c);saveXlsx('chua-dang-bai.xlsx',[{name:'Chưa đăng',rows:A.per.filter(o=>!o.posts&&(ui.rp.dist==='all'||o.p.dist===ui.rp.dist)).map((o,i)=>({'STT':i+1,'Họ tên':o.p.name,'Quận, huyện':DM[o.p.dist].name,'Mã NV':o.p.code,'Email':o.p.email,'Hashtag cá nhân':tagOf(o.p)}))}]);},
  remindNow:()=>remind(ui.rp.camp,'manual',ui.rp.grp==='bk'?'bk':'vt'),
  remind:el=>remind(el.dataset.id,el.dataset.kind),
  tog:el=>{const k=el.dataset.k;S.settings[k]=!S.settings[k];saveSettings();render();},
  addBk:()=>openDlg(personFormBk()),editBk:el=>openDlg(personFormBk(findBk(el.dataset.code))),saveBk:el=>saveBk(el.dataset.old),
  delBk:el=>{const p=findBk(el.dataset.code);openDlg(`<h2>Xóa ${esc(p.name)}?</h2><p style="margin:0">Thành viên này sẽ không còn trong danh sách Booking/Event và không được tính vào báo cáo.</p><div class="acts"><button class="btn" data-act="closeDlg">Hủy</button><button class="btn pri" data-act="delBkOk" data-code="${esc(p.code)}">Xóa thành viên</button></div>`);},
  delBkOk:el=>{S.booking=(S.booking||[]).filter(x=>x.code!==el.dataset.code);saveBooking();closeDlg();toast('Đã xóa thành viên.');render();},
  bpage:el=>{ui.pp.bpage+=+el.dataset.v;render();},seedBk:seedBk,
  exportMissingBk:()=>{const c=S.campaigns[ui.rp.camp];saveXlsx('booking-chua-dang.xlsx',[{name:'Chưa đăng',rows:campAggBk(c).per.filter(o=>!o.posts).map((o,i)=>({'STT':i+1,'Họ tên':o.p.name,'Mã thành viên':o.p.code,'Email':o.p.email,'Mã cá nhân':tagOf(o.p)}))}]);},
  pdfRp:()=>pdfCampaign(),pdfCh:()=>pdfChannels(),
  refreshStats:()=>{const f=refreshInfo();if(!f.left){toast('Hôm nay đã dùng hết 2 lượt cập nhật.');return;}openDlg(`<h2>Cập nhật chỉ số các link?</h2><p style="margin:0">Hệ thống quét lại lượt thích, bình luận, lượt xem và chia sẻ của mọi link người dùng đã nộp trong các chiến dịch đang chạy. Hôm nay còn ${f.left} trên 2 lượt.</p><p class="note mute">Bản này dùng số liệu mô phỏng. Khi triển khai thật, máy chủ đọc chỉ số qua TikTok API và công cụ social listening cho Facebook.</p><div class="acts"><button class="btn" data-act="closeDlg">Hủy</button><button class="btn pri" data-act="refreshOk">Cập nhật ngay</button></div>`);},
  refreshOk:()=>doRefresh(),
  addContent:()=>{readDraft();if(ui.camp.contents.length>=10){toast('Mỗi chiến dịch tối đa 10 content.');return;}ui.camp.contents.push('');render();const t=document.querySelectorAll('[data-content]');if(t.length)t[t.length-1].focus();},
  rmContent:el=>{readDraft();ui.camp.contents.splice(+el.dataset.i,1);render();},
  genContent:()=>{readDraft();genContent();},
  useContent:el=>{readDraft();if(ui.camp.contents.length>=10){toast('Mỗi chiến dịch tối đa 10 content.');return;}ui.camp.contents.push(ui.ai.cres[+el.dataset.i]);ui.ai.cres.splice(+el.dataset.i,1);render();},
  useAllContent:()=>{readDraft();const room=10-ui.camp.contents.length;if(room<=0){toast('Mỗi chiến dịch tối đa 10 content.');return;}const add=ui.ai.cres.slice(0,room);ui.camp.contents=ui.camp.contents.concat(add);ui.ai.cres=ui.ai.cres.slice(room);if(ui.ai.cres.length)toast('Chỉ thêm được '+room+' content vì giới hạn 10.');render();},
  slMove:el=>{const cid=el.dataset.cid,t=document.querySelector('.track[data-cid="'+cid+'"]'),n=(SLIDES[cid]||[]).length;if(!t||!n)return;const i=Math.max(0,Math.min(n-1,(ui.slide[cid]||0)+(+el.dataset.d)));ui.slide[cid]=i;try{t.scrollTo({left:i*t.clientWidth,behavior:'smooth'});}catch(e){t.scrollLeft=i*t.clientWidth;}syncDots(cid);},
  copySlide:el=>{const cid=el.dataset.cid,sl=SLIDES[cid]||[];const s=sl[Math.min(ui.slide[cid]||0,sl.length-1)];if(!s)return;ACT.copyText({dataset:{t:s.copy}});},
  dlSlide:el=>{const c=S.campaigns[el.dataset.cid];if(!c||!(c.banners||[]).length){toast('Chiến dịch chưa có ảnh.');return;}bannerDialog(el.dataset.cid);},
  dlOne:el=>{const c=S.campaigns[el.dataset.cid];const i=+el.dataset.i;bannerPng(c.banners[i],(c.hashtags||[]).join(' '),'banner-'+fileSlug(c.name)+'-'+(i+1));},
  dlAll:el=>dlAllBanners(el.dataset.cid),
  chgPw:()=>{ui.pwKey=ui.pwKey||(isAdmin()?'admin':pwKeyOf(me()));chgPwDialog(false);},
  savePw:()=>{
    const key=ui.pwKey||'admin',old=$('#cpOld').value,n1=$('#cpNew').value,n2=$('#cpNew2').value,msg=$('#cpMsg');
    const bad=t=>{msg.textContent=t;msg.className='small down b';};
    if(hashStr(old)!==pwCurrent(key))return bad('Mật khẩu hiện tại không đúng.');
    if(n1.length<6)return bad('Mật khẩu mới cần ít nhất 6 ký tự.');
    if(n1!==n2)return bad('Hai lần nhập mật khẩu mới không khớp.');
    S.settings.pw=Object.assign({},S.settings.pw||{},{[key]:hashStr(n1)});
    S.settings.pwChanged=Object.assign({},S.settings.pwChanged||{},{[key]:true});
    ui.forceChg=false;saveSettings();closeDlg();toast('Đã đổi mật khẩu.');render();
  },
  refreshPost:el=>refreshPost(el),
  resetTpl:()=>{S.settings.subject=DEFAULT_SETTINGS.subject;S.settings.body=DEFAULT_SETTINGS.body;saveSettings();render();}
};
const CHANGE={
  dsel:el=>{const c=ui.ch;const v=el.value;c.dists=el.checked?c.dists.concat([v]):c.dists.filter(x=>x!==v);c.dists=D.map(d=>d.code).filter(x=>c.dists.includes(x));const keep=true;render();if(keep){const dd=$('#distDD');if(dd)dd.open=true;}},
  mTog:el=>{const c=ui.ch,v=el.value;if(el.checked){if(c.multi.length>=5){el.checked=false;toast('Chọn tối đa 5 đơn vị.');return;}c.multi=c.multi.concat([v]);}else c.multi=c.multi.filter(x=>x!==v);render();},
  dTog:el=>ACT.dTog(el),
  bkTog:el=>{readDraft();ui.camp.booking=el.checked;render();},
  subPf:el=>{ui.sub.pf=el.value;const l=$('#subLinks');if(l)ui.sub.links=l.value;render();}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const el=e.target.closest&&e.target.closest('tr[data-act="heatGo"]');if(el)ACT.heatGo(el);}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.matches('input[data-act]')){(CHANGE[el.dataset.act]||ACT[el.dataset.act])(el);return;}
  if(el.dataset.chf){const k=el.dataset.chf,c=ui.ch;
    if(k==='preset'){c.preset=el.value;if(c.preset!=='custom')applyPreset(c.preset);}
    else if(k==='cmp'){c.cmp=el.value;if(c.cmp==='custom'){const L=c.b-c.a+1;c.ca=c.a-L;c.cb=c.a-1;}}
    else if(k==='a'||k==='b'){const v=posOf(el.value);if(!isNaN(v)){c[k]=Math.max(365,Math.min(N-1,v));if(c.b<c.a){const t=c.a;c.a=c.b;c.b=t;}}}
    else if(k==='ca'||k==='cb'){const v=posOf(el.value);if(!isNaN(v))c[k]=Math.max(0,Math.min(N-1,v));}
    else c[k]=el.value;
    render();return;}
  if(el.dataset.bind&&!el.dataset.live){readDraft();setPath(el.dataset.bind,el.value);if(el.dataset.bind==='pp.dist')ui.pp.page=0;if(el.dataset.bind==='sub.camp'){const l=$('#subLinks');if(l)ui.sub.links=l.value;}render();}
  if(el.dataset.set){const k=el.dataset.set;S.settings[k]=el.type==='number'?Math.max(1,+el.value||1):el.value;saveSettings();render();}
  if(el.dataset.draft)readDraft();
});
function syncDots(cid){const d=document.querySelector('[data-dots="'+cid+'"]');if(d)[...d.children].forEach((x,i)=>x.classList.toggle('on',i===(ui.slide[cid]||0)));}
let slT;document.addEventListener('scroll',e=>{const t=e.target;if(!t.classList||!t.classList.contains('track'))return;clearTimeout(slT);slT=setTimeout(()=>{const cid=t.dataset.cid;ui.slide[cid]=Math.round(t.scrollLeft/Math.max(1,t.clientWidth));syncDots(cid);},80);},true);
document.addEventListener('input',e=>{if(e.target.id==='subLink')ui.sub.link=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='subOk')ui.sub.ok=e.target.checked;});
let liveT;
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.live&&el.dataset.bind){clearTimeout(liveT);liveT=setTimeout(()=>{setPath(el.dataset.bind,el.value);if(el.dataset.bind==='pp.q')ui.pp.page=0;const pos=el.selectionStart,b=el.dataset.bind;render();const n=document.querySelector('[data-bind="'+b+'"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}},250);}
  if(el.id==='gsLink')ui.pp.gsLink=el.value;if(el.id==='gsLinkBk')ui.pp.gsLinkBk=el.value;});
document.addEventListener('click',e=>{const dd=$('#distDD');if(dd&&dd.open&&!dd.contains(e.target))dd.open=false;});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(!window.XLSX){toast('Thư viện Excel chưa tải xong, thử lại sau vài giây.');return;}
  const fr=new FileReader();fr.onload=()=>{try{const wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
    if(e.target.dataset.for==='posts')importPosts(aoa);else{ui.pp.imp=Object.assign((ui.pp.grp==='bk'?parseRowsBk:parseRows)(aoa),{src:f.name});render();}}catch(err){toast('Không đọc được file. Kiểm tra lại định dạng .xlsx hoặc .csv.');}};fr.readAsArrayBuffer(f);});
$('#imgIn').addEventListener('change',e=>{if(e.target.files.length&&ui.camp)uploadImgs(e.target.files);});
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))closeDlg();});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(ui.view==='channels')Object.values(charts).forEach(c=>{try{c.resize();}catch(e){}});},200);});
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(ui.view==='channels')render();});

/* ================= Khởi động ================= */
prefLoad();lsLoad();if(STANDALONE){migrateDemo();if(!campList().length)seedDemo(true);gdRestore();if(gdCid())gdLoad().catch(()=>{});}render();
window.addEventListener('load',()=>{if(ui.view==='channels')render();});
(async()=>{
  if(!window.claude||!window.claude.use)return;
  const get=n=>window.claude.use(n).catch(()=>null);
  const[d,a,s,dl,mc]=await Promise.all([get('db'),get('assets'),get('sample'),get('downloads'),get('mcp')]);
  assets=a;sampleFn=s;downloads=dl;mcp=mc;
  if(d){db=d;shared=true;S.people={};S.booking=[];S.campaigns={};S.posts={};
    const err=e=>toast('Mất kết nối dữ liệu dùng chung ('+(e&&e.code||'lỗi')+'). Tải lại trang để thử lại.');
    db.collection('participants').onSnapshot(q=>{const o={};q.docs.forEach(x=>{const v=x.data();o[x.id]=v&&Array.isArray(v.list)?clone(v.list):[];});S.people=o;remoteRender();},err);
    db.collection('campaigns').onSnapshot(q=>{const o={};q.docs.forEach(x=>o[x.id]=clone(x.data()));S.campaigns=o;remoteRender();},err);
    db.collection('posts').onSnapshot(q=>{const o={};q.docs.forEach(x=>{const v=x.data();o[x.id]=v&&Array.isArray(v.list)?clone(v.list):[];});S.posts=o;remoteRender();},err);
    db.doc('booking/members').onSnapshot(x=>{const v=x.exists?x.data():null;S.booking=v&&Array.isArray(v.list)?clone(v.list):[];remoteRender();},err);
    db.doc('app/settings').onSnapshot(x=>{S.settings=Object.assign(clone(DEFAULT_SETTINGS),x.exists?clone(x.data()):{});remoteRender();},err);
  }
  render();
})();
})();
</script>
