<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viettel Hà Nội – Social Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --g1:#5C0012;--g2:#A3001E;--g3:#E1002D;
  --grad:linear-gradient(135deg,#6A0016 0%,#B0001F 52%,#E1002D 100%);
  --grad-v:linear-gradient(180deg,#4E000F 0%,#8E001B 48%,#C80029 100%);
  --red:#D3002A;--red-rgb:211,0,42;--red-ink:#A3001F;--red-tint:#FDEFF2;--red-soft:#F4C3CD;--tt:#F29AAE;--tt-ink:#B4002A;
  --bg:#F6F4F5;--surface:#FFFFFF;--soft:#FAF8F9;--ink:#1D181C;--ink2:#3A3439;--muted:#6B6369;--faint:#8A8288;
  --line:#ECE6E8;--line2:#F3EFF0;--input:#DCD3D6;--track:#F1ECEE;
  --good:#0E7A44;--good-bg:#E6F4EC;--warn:#9A5B00;--warn-bg:#FFF2DD;--prev:#B9B0B5;--dark:#1D181C;--on-dark:#FFFFFF;
  --shadow:0 1px 2px rgba(40,10,18,.04),0 14px 34px -20px rgba(40,10,18,.22);
  --shadow-red:0 10px 24px -12px rgba(163,0,30,.55);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --red:#FF3358;--red-rgb:255,51,88;--red-ink:#FF8FA4;--red-tint:#3A1520;--red-soft:#6E2333;--tt:#F7A9BA;--tt-ink:#FFB3C3;
  --bg:#121014;--surface:#1B181D;--soft:#211D23;--ink:#F4EFF2;--ink2:#DDD6DB;--muted:#ADA4AB;--faint:#948B92;
  --line:#2F2A31;--line2:#28242A;--input:#48414A;--track:#2B262D;
  --good:#7ED7A6;--good-bg:#15301F;--warn:#F5B871;--warn-bg:#33240F;--prev:#615A60;--dark:#F4EFF2;--on-dark:#121014;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -20px rgba(0,0,0,.6);color-scheme:dark;}}
:root[data-theme="dark"]{
  --red:#FF3358;--red-rgb:255,51,88;--red-ink:#FF8FA4;--red-tint:#3A1520;--red-soft:#6E2333;--tt:#F7A9BA;--tt-ink:#FFB3C3;
  --bg:#121014;--surface:#1B181D;--soft:#211D23;--ink:#F4EFF2;--ink2:#DDD6DB;--muted:#ADA4AB;--faint:#948B92;
  --line:#2F2A31;--line2:#28242A;--input:#48414A;--track:#2B262D;
  --good:#7ED7A6;--good-bg:#15301F;--warn:#F5B871;--warn-bg:#33240F;--prev:#615A60;--dark:#F4EFF2;--on-dark:#121014;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -20px rgba(0,0,0,.6);color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--red-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
img{max-width:100%}
.app{display:flex;flex-wrap:wrap;min-height:100%}

/* Sidebar */
.side{flex:1 1 248px;max-width:100%;background:var(--grad);color:#fff;padding:26px 16px 22px;display:flex;flex-direction:column;gap:3px}
.brand{display:flex;align-items:center;gap:12px;padding:2px 10px 22px}
.mark{width:34px;height:34px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;flex:none}
.mark span{width:10px;height:10px;border-radius:50%;background:#fff}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.brand small{font-size:12.5px;color:rgba(255,255,255,.75)}
.navlabel{padding:14px 12px 6px;font-size:12.5px;color:rgba(255,255,255,.62);font-weight:500}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:10px;border:0;background:transparent;font-size:15px;font-weight:500;color:rgba(255,255,255,.88);cursor:pointer;min-height:44px}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav:hover{background:rgba(255,255,255,.1);color:#fff}
.nav[aria-current="page"]{background:#fff;color:var(--g2);font-weight:700;box-shadow:0 8px 20px -10px rgba(0,0,0,.45)}
.me{margin-top:auto;padding:18px 12px 0;border-top:1px solid rgba(255,255,255,.18);display:flex;flex-direction:column;gap:2px;font-size:14px}
.me small{color:rgba(255,255,255,.72);font-size:12.5px}
.me .btn{align-self:flex-start;margin-top:12px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;min-height:36px;font-size:13px}
.me .btn:hover{background:rgba(255,255,255,.2)}
.store{font-size:11.5px;color:rgba(255,255,255,.6);margin-top:8px}

/* Main */
main{flex:999 1 560px;min-width:0;padding:30px 36px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:clamp(25px,2.6vw,34px);line-height:1.15;letter-spacing:-.025em;font-weight:800}
h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
h3{margin:0;font-size:15px;font-weight:700}
.lead{margin:6px 0 0;color:var(--muted);max-width:780px;font-size:14.5px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.stamp{text-align:right;font-size:13px;color:var(--muted)}
.stamp b{display:block;font-size:24px;font-weight:800;letter-spacing:-.01em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--shadow)}
.panel.flush{padding:0;gap:0}
.ph{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.panel.flush>.ph{padding:20px 24px 14px}
.hint{color:var(--muted);font-size:13px;margin:3px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.grid2.wide{grid-template-columns:1.35fr 1fr}
@media (max-width:1100px){.grid2.wide{grid-template-columns:1fr}}

/* Filter bar */
.fbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;box-shadow:var(--shadow)}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel{font-size:12.5px;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;padding:3px;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;min-height:34px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--grad);color:#fff;font-weight:700;box-shadow:var(--shadow-red)}
.sel,.in{border:1px solid var(--input);background:var(--surface);border-radius:10px;padding:0 12px;font-size:14px;min-height:40px;color:var(--ink);min-width:0}
textarea.in{padding:10px 12px;line-height:1.6;resize:vertical;font-size:15px}
.in.lg{min-height:46px;font-size:15px}
.dd{position:relative}
.dd summary{list-style:none;cursor:pointer;border:1px solid var(--input);border-radius:10px;padding:0 12px;font-size:14px;min-height:40px;display:flex;align-items:center;gap:8px;background:var(--surface)}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);margin-left:4px}
.dd-panel{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 20px 40px -16px rgba(0,0,0,.3);width:min(520px,86vw);z-index:30}
.dd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px;max-height:320px;overflow:auto}
.dd-panel label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;font-size:14px;cursor:pointer}
.dd-panel label:hover{background:var(--soft)}
.dd-panel input{accent-color:var(--red);width:16px;height:16px}
.dd-actions{display:flex;gap:6px;border-top:1px solid var(--line);margin-top:8px;padding-top:8px;flex-wrap:wrap}
.range-line{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px}
.range-line b{color:var(--ink);font-weight:600}

/* Buttons */
.btn{min-height:42px;padding:0 18px;border-radius:11px;border:1px solid var(--input);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--shadow-red)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dark{border-color:var(--ink)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--red-ink);border-color:var(--red-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--red-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.pill{min-height:34px;padding:0 13px;border-radius:18px;border:1px solid var(--input);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;overflow:hidden;box-shadow:var(--shadow)}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--grad)}
.kpi .k-l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .k-v{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:6px 0 3px}
.kpi .k-d{font-size:12.5px;font-weight:600}
.kpi.hot{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--shadow-red)}
.kpi.hot::before{display:none}
.kpi.hot .k-l,.kpi.hot .k-d{color:rgba(255,255,255,.82)}
.split{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--track);margin:10px 0 6px}
.split i{display:block;height:100%}
.split .fb{background:var(--grad)}.split .tt{background:var(--tt)}
.split-t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.up{color:var(--good)}.down{color:var(--red-ink)}.flat{color:var(--muted)}

/* Insights */
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ins{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;position:relative;padding-left:20px;box-shadow:var(--shadow)}
.ins::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--grad)}
.ins strong{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:3px}
.chart-box{position:relative;height:320px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:10px;border-radius:3px;display:inline-block;background:var(--grad)}
.sw.tt{background:var(--tt)}.sw.p{background:var(--prev);height:4px}

/* Tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:0;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
th.r,td.r{text-align:right}
th>.thb,th>span.th{display:flex;align-items:center;gap:4px;width:100%;min-height:42px;padding:0 12px;border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;text-align:inherit;justify-content:flex-start}
th.r>.thb,th.r>span.th{justify-content:flex-end}
th>span.th{cursor:default}
.thb:hover{color:var(--ink)}
.arr{display:inline-block;width:12px;color:var(--red);font-weight:800}
.arr.idle{color:var(--line);}
.thb:hover .arr.idle{color:var(--faint)}
td{padding:11px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tbody tr:hover td{background:var(--soft)}
tr.mine td{background:var(--red-tint)}
td.wrap{white-space:normal;min-width:220px}
.b{font-weight:600}.hash{font-weight:700;color:var(--red-ink)}
.mut{color:var(--muted)}.small{font-size:13px}
.chn{display:flex;align-items:center;gap:10px}
.pf{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none;background:var(--grad)}
.pf.tt{background:var(--surface);color:var(--red);border:1.5px solid var(--red)}
.chn small{display:block;color:var(--muted);font-size:12px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:var(--good);background:var(--good-bg)}.st.low{color:var(--warn);background:var(--warn-bg)}.st.stop{color:var(--red-ink);background:var(--red-tint)}.st.mute{color:var(--muted);background:var(--track)}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.t-ok{background:var(--good-bg);color:var(--good)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--red-tint);color:var(--red-ink)}.t-mute{background:var(--track);color:var(--muted)}

/* Heatmap */
.heat{min-width:980px}
.heat td{padding:3px}
.heat td.dn{padding:6px 10px;font-weight:600;white-space:nowrap}
.heat tr.hrow{cursor:pointer}
.heat tr.hrow:hover td.dn{color:var(--red)}
.heat tbody tr:hover td{background:transparent}
.cell{border-radius:9px;padding:8px 10px;text-align:right;min-width:92px}
.cell .v{font-weight:700;font-size:14px}
.cell .d{font-size:11.5px;font-weight:600;opacity:.92}
.cell.hot{color:#fff}.cell.hot .d{color:#fff}
.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--soft);border:1px solid var(--line);font-weight:700;font-size:12.5px;margin-right:8px}
.rank.r1{background:var(--grad);color:#fff;border-color:transparent}
.scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.scale i{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(var(--red-rgb),.05),rgba(var(--red-rgb),.68))}

/* H2H */
.vs{font-weight:800;color:var(--red)}
.h2h-row{display:grid;grid-template-columns:1fr minmax(120px,2fr) 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.h2h-row:first-child{border-top:0}
.h2h-row .a{text-align:right;font-weight:600}.h2h-row .b{font-weight:600}
.h2h-row .win{color:var(--red);font-weight:800}
.h2h-bar .lbl{text-align:center;font-size:12px;color:var(--muted);margin-bottom:5px}
.h2h-bar .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--track)}
.h2h-bar .ba{background:var(--grad)}.h2h-bar .bb{background:var(--tt)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--red-tint);color:var(--red-ink);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600}
.chip button{border:0;background:transparent;cursor:pointer;color:inherit;font-size:16px;line-height:1;padding:0 6px;min-height:24px}
.ctabs{display:flex;gap:6px;flex-wrap:wrap}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;background:var(--surface)}
.mchips label.on{background:var(--red-tint);border-color:var(--red-soft);color:var(--red-ink);font-weight:600}
.mchips input{accent-color:var(--red)}

/* misc */
.meter{flex:1;height:8px;background:var(--track);border-radius:4px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--grad)}
.meter.dk i{background:var(--dark)}
.drop{border:1.5px dashed var(--red-soft);border-radius:14px;background:var(--red-tint);padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipg{padding:6px 10px;border-radius:8px;background:var(--track);font-size:13px}
.hashbig{font-size:26px;font-weight:800;letter-spacing:-.01em}
.hashbig em{font-style:normal;color:var(--red)}
.status{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:14px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{min-height:48px;padding:0 18px;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{color:var(--red-ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--grad)}
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 7px;border-radius:22px;background:var(--surface);font-size:14px;font-weight:600;color:var(--faint);border:1px solid var(--line)}
.steps li span{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--track);font-size:13px}
.steps li.done{color:var(--ink)}.steps li.done span,.steps li.cur span{background:var(--grad);color:#fff}
.steps li.cur{background:var(--red-tint);color:var(--red-ink);border-color:var(--red-soft)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:6px}
.dchk{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);font-size:14px;cursor:pointer}
.dchk.on{background:var(--red-tint);border-color:var(--red-soft)}
.dchk input{width:18px;height:18px;accent-color:var(--red)}
.dchk span{flex:1}.dchk small{color:var(--muted);font-size:12px}
.banners{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px}
.bn{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--track);display:flex;flex-direction:column}
.bn .art{aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--soft)}
.bn .art svg,.bn .art img{width:100%;height:100%;object-fit:contain;display:block}
.bn .ops{display:flex;gap:4px;padding:6px;background:var(--surface)}
.bn .ops button{flex:1;min-height:32px;font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer}
.addbn{aspect-ratio:1;border:1.5px dashed var(--input);border-radius:12px;background:var(--surface);color:var(--muted);font-weight:600;cursor:pointer}
.aibox{padding:16px;border-radius:14px;background:var(--soft);border:1px solid var(--line2);display:flex;flex-direction:column;gap:12px}
.cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}

.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.optc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}

<body>
<div id="root" class="app"></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".xlsx,.xls,.csv" class="vh" aria-hidden="true" tabindex="-1">

<script>
(function(){
'use strict';
/* ================= Danh mục ================= */
const D=[['BDH','Ba Đình','q'],['HKM','Hoàn Kiếm','q'],['THO','Tây Hồ','q'],['LBN','Long Biên','q'],['CGY','Cầu Giấy','q'],['DDA','Đống Đa','q'],['HBT','Hai Bà Trưng','q'],['HMI','Hoàng Mai','q'],['TXN','Thanh Xuân','q'],['NTL','Nam Từ Liêm','q'],['BTL','Bắc Từ Liêm','q'],['HDG','Hà Đông','q'],['STY','Sơn Tây','h'],['BVI','Ba Vì','h'],['PTH','Phúc Thọ','h'],['DPG','Đan Phượng','h'],['HDU','Hoài Đức','h'],['QOI','Quốc Oai','h'],['TTT','Thạch Thất','h'],['CMY','Chương Mỹ','h'],['TOI','Thanh Oai','h'],['TTN','Thường Tín','h'],['PXN','Phú Xuyên','h'],['UHA','Ứng Hòa','h'],['MDC','Mỹ Đức','h'],['MLH','Mê Linh','h'],['DAH','Đông Anh','h'],['SSN','Sóc Sơn','h'],['GLM','Gia Lâm','h'],['TTR','Thanh Trì','h']].map(a=>({code:a[0],name:a[1],g:a[2]}));
const DM=Object.fromEntries(D.map(d=>[d.code,d]));
const DORDER=Object.fromEntries(D.map((d,i)=>[d.code,i]));

/* ================= Tiện ích ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const noDia=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim();
const NF=new Intl.NumberFormat('vi-VN'),CF=new Intl.NumberFormat('vi-VN',{notation:'compact',maximumFractionDigits:1});
const nf=n=>NF.format(Math.round(n||0));
const cf=n=>Math.abs(n)>=100000?CF.format(n):nf(n);
const pct=(a,b)=>b?(Math.round(a/b*1000)/10).toString().replace('.',',')+'%':'—';
const DAY=864e5;
const isoToIdx=s=>{const[y,m,d]=s.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/DAY);};
const idxToIso=i=>new Date(i*DAY).toISOString().slice(0,10);
const idxToVn=i=>{const s=idxToIso(i);return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4);};
const idxShort=i=>{const s=idxToIso(i);return s.slice(8,10)+'/'+s.slice(5,7);};
const isoVn=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const now=new Date();
const TODAY=Math.floor(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/DAY);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0;}
function rnd(seed){let t=(seed+0x6D2B79F5)|0;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function matchDistrict(v){const n=noDia(v).replace(/^(quan|huyen|thi xa|tx|q\.|h\.)\s*/,'').replace(/\s+/g,' ');if(!n)return null;const up=n.toUpperCase();if(DM[up])return up;const f=D.find(d=>noDia(d.name)===n);return f?f.code:null;}
const bkTagCode=c=>{c=String(c).toUpperCase();return c.startsWith('BK')?c:'BK'+c;};
const tagOf=p=>p.grp==='bk'?'#VTHN'+bkTagCode(p.code):'#VTHN'+p.dist+String(p.code).toUpperCase();
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function dlt(c,p){if(p==null||!isFinite(p)||p===0)return null;return(c-p)/p;}
function dHtml(d,txt){if(d==null)return'<span class="flat">'+(txt||'—')+'</span>';const cls=Math.abs(d)<.005?'flat':d>0?'up':'down',ar=cls==='flat'?'■':d>0?'▲':'▼';return'<span class="'+cls+'">'+ar+' '+(Math.abs(d)*100).toFixed(1).replace('.',',')+'%</span>';}
const ICON={
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.7.8 2.7 2.5 3 5.2"/>',
 flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',report:'<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
 send:'<path d="M21 3 3 10.5l7 2.5 2.5 7z"/><path d="m10 13 5-5"/>',star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'};
const ico=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ================= Trạng thái & lưu trữ ================= */
const DEFAULT_SETTINGS={remEnabled:true,remDays:3,remTime:'08:30',rem2:true,rem2Days:7,ccManagers:false,gsUrl:'',
 subject:'[Nhắc nhở] Anh/chị chưa có bài đăng cho chiến dịch [Tên chiến dịch]',
 body:'Chào anh/chị [Họ tên],\n\nChiến dịch [Tên chiến dịch] đã phát động được [Số ngày] ngày. Đến nay, hệ thống chưa ghi nhận bài đăng nào có hashtag cá nhân của anh/chị.\n\nĐể bài được tính cho [Quận, huyện], anh/chị vui lòng đăng ít nhất 1 bài trên Facebook hoặc TikTok cá nhân trước ngày [Ngày kết thúc]:\n  • Để bài ở chế độ Công khai.\n  • Dùng banner và nội dung gợi ý của chiến dịch.\n  • Gắn đủ 2 hashtag: [Hashtag chính] [Hashtag cá nhân]\n  • Sau khi đăng, vào Social Hub, mục Nộp báo cáo, dán link bài.\n\nHiện [Quận, huyện] đã có [Số người đã đăng] trên [Tổng số người] đồng nghiệp đăng bài. Bài của anh/chị sẽ giúp đơn vị lên hạng trên bảng xếp hạng chiến dịch.\n\nTrân trọng,\nBan Truyền thông, Viettel Hà Nội',
 log:[]};
const S={people:{},booking:[],campaigns:{},posts:{},settings:clone(DEFAULT_SETTINGS)};
const ui={view:'login',role:'admin',meEmail:'',adminName:'Quản lý truyền thông',sort:{},
 ch:{plat:'all',preset:'30',a:0,b:0,cmp:'prev',ca:null,cb:null,dists:D.map(d=>d.code),trendM:'views',distM:'views',q:'',tD:null,ctab:'h2h',hA:'CGY',hB:'DDA',cA:'CGY-fb',cB:'CGY-tt',multi:['CGY','DDA','HDG'],multiM:'views',platM:'views'},
 pp:{grp:'vt',dist:'all',q:'',page:0,bq:'',bpage:0,imp:null,mode:'merge',gsLink:'',gsLinkBk:'',gsBusy:false,gsCreated:null,gsCreatedBk:null,gsErr:''},
 camp:null,ai:{prompt:'',ratio:'1:1',busy:false,results:[]},
 rp:{camp:null,tab:'posts',dist:'all',grp:'vt',btab:'posts'},sub:{camp:'',pf:'fb',links:'',more:false}};
let db=null,assets=null,sampleFn=null,downloads=null,mcp=null,shared=false;
const LS='vthn-social-hub-v2';
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v){S.people=v.people||{};S.booking=v.booking||[];S.campaigns=v.campaigns||{};S.posts=v.posts||{};S.settings=Object.assign(clone(DEFAULT_SETTINGS),v.settings||{});}}catch(e){}}
function prefSave(){try{localStorage.setItem(LS+'-ui',JSON.stringify({role:ui.role,meEmail:ui.meEmail,adminName:ui.adminName}));}catch(e){}}
function prefLoad(){try{const v=JSON.parse(localStorage.getItem(LS+'-ui')||'null');if(v){ui.role=v.role||'admin';ui.meEmail=v.meEmail||'';ui.adminName=v.adminName||ui.adminName;}}catch(e){}}
const queues={};
function write(path,data){
  if(!db){lsSave();return Promise.resolve();}
  const prev=queues[path]||Promise.resolve();
  const p=prev.then(()=>data===null?db.doc(path).delete():db.doc(path).set(data)).catch(e=>toast('Chưa lưu được dữ liệu ('+(e&&e.code||'lỗi')+'). Kiểm tra quyền chỉnh sửa của bạn với link này.'));
  queues[path]=p;return p;
}
const savePeople=dist=>write('participants/'+dist,S.people[dist]&&S.people[dist].length?{list:S.people[dist]}:null);
const saveCamp=id=>write('campaigns/'+id,S.campaigns[id]||null);
const savePosts=id=>write('posts/'+id,S.posts[id]?{list:S.posts[id]}:null);
const saveSettings=()=>write('app/settings',S.settings);
const saveBooking=()=>write('booking/members',S.booking&&S.booking.length?{list:S.booking}:null);

/* ================= Truy vấn ================= */
const allPeople=()=>Object.keys(S.people).flatMap(k=>S.people[k]||[]).sort((a,b)=>(DORDER[a.dist]-DORDER[b.dist])||a.name.localeCompare(b.name,'vi'));
const peopleIn=dists=>allPeople().filter(p=>dists.includes(p.dist));
const findByCode=code=>allPeople().find(p=>String(p.code).toUpperCase()===String(code).toUpperCase());
const allBooking=()=>(S.booking||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'vi'));
const findBk=code=>{const u=String(code).toUpperCase();return(S.booking||[]).find(p=>{const c=String(p.code).toUpperCase();return c===u||c==='BK'+u||bkTagCode(c)===bkTagCode(u);});};
const personOfPost=x=>x.grp==='bk'?findBk(x.code):findByCode(x.code);
const unitName=p=>p?(p.grp==='bk'?'Booking/Event':DM[p.dist].name):'';
const isMine=(p,m)=>!!m&&String(p.code)===String(m.code)&&((p.grp==='bk')===(m.grp==='bk'));
const me=()=>{const e=String(ui.meEmail).toLowerCase();return allPeople().find(p=>p.email.toLowerCase()===e)||allBooking().find(p=>p.email.toLowerCase()===e);};
const isBkUser=()=>ui.role!=='admin'&&!!me()&&me().grp==='bk';
const isAdmin=()=>ui.role==='admin';
const campList=()=>Object.values(S.campaigns).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
function campStatus(c){
  if(!c.createdAt||c.status==='draft')return{t:'Nháp',cls:'t-mute'};
  if(!c.sentAt)return{t:'Chưa gửi thông báo',cls:'t-warn'};
  if(TODAY>(c.end?isoToIdx(c.end):TODAY))return{t:'Đã kết thúc',cls:'t-mute'};
  return{t:'Đang chạy',cls:'t-ok'};
}
const myCamps=()=>{const m=me();return m?campList().filter(c=>c.sentAt&&(m.grp==='bk'?!!c.booking:(c.districts||[]).includes(m.dist))):[];};

/* ================= Sắp xếp bảng ================= */
function sortRows(id,rows,defK,defDir){
  const s=ui.sort[id]||{k:defK,dir:defDir};
  const k=s.k,dir=s.dir;
  return rows.slice().sort((a,b)=>{let x=a[k],y=b[k];if(x==null||x==='')x=typeof y==='string'?'':-Infinity;if(y==null||y==='')y=typeof x==='string'?'':-Infinity;
    return(typeof x==='string'&&typeof y==='string'?x.localeCompare(y,'vi'):(x-y))*dir;});
}
function TH(id,k,label,opts){
  opts=opts||{};const s=ui.sort[id]||{k:opts.defK,dir:opts.defDir};
  const on=s.k===k;const cls=opts.r?'r':'';
  if(opts.nosort)return`<th class="${cls}" scope="col"><span class="th">${label}</span></th>`;
  return`<th class="${cls}" scope="col" aria-sort="${on?(s.dir>0?'ascending':'descending'):'none'}"><button class="thb" data-act="sort" data-t="${id}" data-k="${k}" data-str="${opts.str?1:''}" title="Bấm để sắp xếp">${label}<span class="arr ${on?'':'idle'}">${on?(s.dir>0?'↑':'↓'):'↕'}</span></button></th>`;
}

/* ================= Tải xuống ================= */
async function saveFile(name,data,type){
  if(!downloads&&STANDALONE){const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:type||'application/octet-stream'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return;}
  if(!downloads){toast('Tải file chưa khả dụng ở chế độ xem này. Hãy mở link trên claude.ai.');return;}
  try{await downloads.save({filename:name,data:data instanceof Blob?data:new Blob([data],{type:type||'application/octet-stream'})});}
  catch(e){if(e&&e.code!=='declined')toast('Không tải được file ('+(e.code||'lỗi')+').');}
}
function saveXlsx(name,sheets){
  if(!window.XLSX){toast('Thư viện Excel chưa tải xong, thử lại sau vài giây.');return;}
  const wb=XLSX.utils.book_new();
  sheets.forEach(s=>{const ws=XLSX.utils.json_to_sheet(s.rows);if(s.cols)ws['!cols']=s.cols.map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31));});
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  saveFile(name,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',4600);}
function openDlg(html){$('#dlgBody').innerHTML=html;const d=$('#dlg');if(!d.open)d.showModal();}
function closeDlg(){const d=$('#dlg');if(d.open)d.close();}

/* ================= Dữ liệu kênh (mô phỏng) ================= */
const N=730,DAY0=TODAY-(N-1);
const posOf=iso=>isoToIdx(iso)-DAY0;
const vn=i=>idxToVn(DAY0+i),vns=i=>idxShort(DAY0+i),isoP=i=>idxToIso(DAY0+i);
const SPECIAL={'BVI-tt':{stop:12},'MDC-fb':{stop:9},'UHA-tt':{pp:.07},'PXN-fb':{pp:.16},'CGY-tt':{boost:2.3},'HKM-fb':{boost:1.6},'HDG-tt':{boost:1.5},'DDA-fb':{boost:1.3}};
const CH=[];
D.forEach((d,k)=>['fb','tt'].forEach((p,j)=>{
  const r=rng((k+1)*97+(j+1)*13),sp=SPECIAL[d.code+'-'+p]||{},size=(d.g==='q'?.8:.38)+r()*1.1;
  const slug=noDia(d.name).replace(/\s+/g,'');

    pp:sp.pp!=null?sp.pp:(p==='fb'?.35+r()*.5:.25+r()*.55),base:(p==='fb'?900:3600)*size*(sp.boost||1),

const HEAD_MAP=[['dist',['quan huyen','quan/huyen','quan, huyen','don vi','quan','huyen']],['name',['ho ten','ho va ten','ten']],['code',['ma nhan vien','ma nv','manv','ma']],['email',['email','e-mail','mail']]];
function mapHeader(h){const n=noDia(h).replace(/\s+/g,' ');if(n.includes('facebook'))return'fb';if(n.includes('tiktok'))return'tt';if(n==='stt')return null;for(const[k,arr]of HEAD_MAP)if(arr.includes(n))return k;if(n.startsWith('ma'))return'code';if(n.includes('email'))return'email';if(n.includes('quan')||n.includes('huyen'))return'dist';if(n.includes('ten'))return'name';return null;}
function parseRows(aoa){
  if(!aoa.length)return{ok:[],errs:[{row:0,msg:'File trống'}]};
  const hi=aoa.findIndex(r=>r.filter(c=>mapHeader(c)).length>=3);
  if(hi<0)return{ok:[],errs:[{row:1,msg:'Không tìm thấy dòng tiêu đề. Cần các cột: Quận/huyện, Họ tên, Mã nhân viên, Email, Link Facebook, Link TikTok.'}]};
  const map=aoa[hi].map(mapHeader);const ok=[],errs=[],seen={};
  aoa.slice(hi+1).forEach((r,ix)=>{
    const o={};map.forEach((k,j)=>{if(k)o[k]=String(r[j]==null?'':r[j]).trim();});
    if(!Object.values(o).some(Boolean))return;
    const line=hi+ix+2,msgs=[];
    const dist=matchDistrict(o.dist);if(!dist)msgs.push('quận, huyện không đúng ("'+(o.dist||'trống')+'")');
    if(!o.name)msgs.push('thiếu họ tên');
    const code=(o.code||'').replace(/\s/g,'').toUpperCase();if(!code)msgs.push('thiếu mã nhân viên');else if(!/^[A-Z0-9]+$/.test(code))msgs.push('mã nhân viên chỉ gồm chữ và số');else if(seen[code])msgs.push('trùng mã nhân viên với dòng '+seen[code]);
    if(!o.email)msgs.push('thiếu email');else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email))msgs.push('email sai định dạng');
    if(o.fb&&!/facebook\.com|fb\.com|fb\.me/i.test(o.fb))msgs.push('link Facebook sai');
    if(o.tt&&!/tiktok\.com/i.test(o.tt))msgs.push('link TikTok sai');
    if(msgs.length){errs.push({row:line,msg:msgs.join(', '),name:o.name||''});return;}
    seen[code]=line;ok.push({dist,name:o.name,code,email:o.email.toLowerCase(),fb:o.fb||'',tt:o.tt||''});
  });
  return{ok,errs};
}

// Để trống thì quản lý có thể dán Client ID ngay trên trang (lưu trên trình duyệt). Xem README.md.
const GOOGLE_CLIENT_ID='';

const GD_SCOPES=['https://www.googleapis.com/auth/drive.file','https://www.googleapis.com/auth/spreadsheets.readonly'];
const GD_KEY=LS+'-gclient';
const gd={tok:null,exp:0,email:'',client:null,cid:null,loading:null,waiters:null};
const gdCid=()=>{if(GOOGLE_CLIENT_ID)return GOOGLE_CLIENT_ID;try{return localStorage.getItem(GD_KEY)||'';}catch(e){return'';}};
const gdOn=()=>!!gd.tok&&Date.now()<gd.exp;
const gdReady=()=>!!(window.google&&google.accounts&&google.accounts.oauth2);
function gdLoad(){if(gdReady())return Promise.resolve();
  if(!gd.loading)gd.loading=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=ok;sc.onerror=()=>{gd.loading=null;no({code:'gd_load'});};document.head.appendChild(sc);});
  return gd.loading;}
function gdKeep(){try{if(gd.tok)sessionStorage.setItem(GD_KEY+'-tok',JSON.stringify({tok:gd.tok,exp:gd.exp,email:gd.email}));else sessionStorage.removeItem(GD_KEY+'-tok');}catch(e){}}
function gdRestore(){try{const v=JSON.parse(sessionStorage.getItem(GD_KEY+'-tok')||'null');if(v&&v.exp>Date.now()){gd.tok=v.tok;gd.exp=v.exp;gd.email=v.email||'';}}catch(e){}}
/* Phải gọi đồng bộ trong sự kiện bấm nút để trình duyệt không chặn cửa sổ đăng nhập Google. */
function gdToken(){
  if(gdOn())return Promise.resolve(gd.tok);
  const cid=gdCid();if(!cid)return Promise.reject({code:'gd_no_client'});
  if(!gdReady())return gdLoad().then(()=>Promise.reject({code:'gd_retry'}));
  if(!gd.client||gd.cid!==cid){gd.cid=cid;gd.client=google.accounts.oauth2.initTokenClient({client_id:cid,scope:GD_SCOPES.join(' '),
    callback:r=>{const w=gd.waiters;gd.waiters=null;if(!w)return;
      if(r.error){w.no({code:r.error==='access_denied'?'gd_denied':'gd_auth'});return;}
      if(!google.accounts.oauth2.hasGrantedAllScopes(r,...GD_SCOPES)){w.no({code:'gd_scope'});return;}
      gd.tok=r.access_token;gd.exp=Date.now()+((+r.expires_in||3600)-60)*1000;gdKeep();w.ok(gd.tok);},
    error_callback:e=>{const w=gd.waiters;gd.waiters=null;if(w)w.no({code:e&&e.type==='popup_closed'?'gd_closed':e&&e.type==='popup_failed_to_open'?'gd_popup':'gd_auth'});}});}
  return new Promise((ok,no)=>{if(gd.waiters)gd.waiters.no({code:'gd_closed'});gd.waiters={ok,no};gd.client.requestAccessToken({prompt:gd.email?'':'select_account'});});
}
async function gdFetch(url,opt){
  const t=await gdToken();opt=Object.assign({},opt||{});opt.headers=Object.assign({Authorization:'Bearer '+t},opt.headers||{});
  let r;try{r=await fetch(url,opt);}catch(e){throw{code:'server_unavailable'};}
  if(r.status===401){gd.tok=null;gdKeep();throw{code:'gd_expired'};}
  if(!r.ok)throw{code:r.status===403?'gd_forbidden':r.status===404?'gd_notfound':r.status===400?'gd_bad':'tool_error'};
  return r.json();
}

function savePerson(old){
  const v=id=>$(id).value.trim();
  const res=parseRows([['Quận/huyện','Họ tên','Mã nhân viên','Email','Link Facebook','Link TikTok'],[DM[v('#pfDist')].name,v('#pfName'),v('#pfCode'),v('#pfEmail'),v('#pfFb'),v('#pfTt')]]);
  const msg=$('#pfMsg');
  if(res.errs.length){msg.textContent='Cần sửa: '+res.errs[0].msg+'.';msg.className='small down b';return;}
  const p=res.ok[0];const ex=findByCode(p.code);
  if(ex&&!old){msg.textContent='Mã nhân viên này đã có trong danh sách.';msg.className='small down b';return;}
  if(ex){S.people[ex.dist]=S.people[ex.dist].filter(x=>x.code!==ex.code);savePeople(ex.dist);p.addedAt=ex.addedAt;}
  (S.people[p.dist]=S.people[p.dist]||[]).push(p);savePeople(p.dist);
  closeDlg();toast('Đã lưu '+p.name);render();
}
function seedPeople(){
  const ho=['Nguyễn','Trần','Lê','Phạm','Hoàng','Vũ','Đỗ','Bùi','Đặng','Ngô'],dem=['Văn','Thị','Minh','Thu','Quang','Ngọc','Hồng','Đức'],ten=['Anh','Bình','Cường','Dung','Hà','Hải','Hằng','Huy','Khánh','Lan','Linh','Mai','Nam','Nhung','Phúc','Quân','Sơn','Trang','Tùng','Yến'];
  const pick=(a,s)=>a[Math.floor(rnd(s)*a.length)];
  D.slice(0,18).forEach((d,di)=>{const k=3+Math.floor(rnd(di*97)*5);S.people[d.code]=S.people[d.code]||[];for(let i=0;i<k;i++){const s=di*1000+i;const name=pick(ho,s)+' '+pick(dem,s+1)+' '+pick(ten,s+2);const code=String(17000+Math.floor(rnd(s+3)*15000)).padStart(6,'0');const slug=noDia(name).replace(/\s+/g,'.');
    if(findByCode(code))continue;S.people[d.code].push({dist:d.code,name,code,email:noDia(name.split(' ').slice(-1)[0])+code.slice(-3)+'@viettel.com.vn',fb:'https://facebook.com/'+slug,tt:'https://tiktok.com/@'+slug.replace(/\./g,''),addedAt:new Date().toISOString()});}
    savePeople(d.code);});
  toast('Đã nạp '+allPeople().length+' người mẫu.');render();
}

const RATIOS={'1:1':[1080,1080],'4:5':[1080,1350],'9:16':[1080,1920]};
function wrapTxt(t,n){const w=String(t||'').split(/\s+/);const out=[];let cur='';w.forEach(x=>{if((cur+' '+x).trim().length>n&&cur){out.push(cur);cur=x;}else cur=(cur+' '+x).trim();});if(cur)out.push(cur);return out.slice(0,4);}
function bannerSVG(b,hashtag){
  if(b.type==='img')return null;
  const[W,H]=RATIOS[b.ratio||'1:1'];const F="'Be Vietnam Pro',Arial,sans-serif";
  const hl=wrapTxt(b.headline,15),sb=wrapTxt(b.sub,30);const lay=b.layout||'red';const RED='#E1002D',INK='#1D181C';
  const gid='g'+hashStr(JSON.stringify(b)).toString(36);
  const defs=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5E0013"/><stop offset=".55" stop-color="#B0001F"/><stop offset="1" stop-color="#E1002D"/></linearGradient></defs>`;
  const T=(lines,x,y,size,fill,wt,lh)=>lines.map((l,i)=>`<text x="${x}" y="${y+i*size*(lh||1.12)}" font-family="${F}" font-size="${size}" font-weight="${wt||700}" fill="${fill}">${esc(l)}</text>`).join('');
  const hy=lay==='split'?H*.18:H*.4;const cw=Math.max(260,(b.cta||'').length*26+90);let body='';
  if(lay==='red'){body=`<rect width="${W}" height="${H}" fill="url(#${gid})"/><circle cx="${W*.95}" cy="${H*.12}" r="${W*.3}" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="60"/>
   ${T(['Viettel Hà Nội'],80,120,44,'#FFFFFF',700)}${T(hl,80,hy,104,'#FFFFFF',800)}${T(sb,80,hy+hl.length*116+40,44,'#FFE3E8',500,1.35)}
   <rect x="80" y="${H-260}" rx="44" width="${cw}" height="88" fill="#FFFFFF"/>${T([b.cta||'Tìm hiểu ngay'],124,H-202,38,RED,700)}${T([hashtag||''],80,H-80,40,'#FFFFFF',600)}`;}
  else if(lay==='white'){body=`<rect width="${W}" height="${H}" fill="#FFFFFF"/><rect width="${W}" height="28" fill="url(#${gid})"/><circle cx="${W*1.02}" cy="${H*.98}" r="${W*.5}" fill="url(#${gid})"/>
   ${T(['Viettel Hà Nội'],80,140,44,RED,700)}${T(hl,80,hy,104,INK,800)}${T(sb,80,hy+hl.length*116+40,44,'#5E5866',500,1.35)}
   <rect x="80" y="${H-300}" rx="44" width="${cw}" height="88" fill="${INK}"/>${T([b.cta||'Tìm hiểu ngay'],124,H-242,38,'#FFFFFF',700)}${T([hashtag||''],80,H-90,40,RED,600)}`;}
  else{const sh=H*.56;body=`<rect width="${W}" height="${H}" fill="#FFFFFF"/><rect width="${W}" height="${sh}" fill="url(#${gid})"/>
   ${T(['Viettel Hà Nội'],80,120,44,'#FFFFFF',700)}${T(hl,80,hy+80,104,'#FFFFFF',800)}${T(sb,80,sh+120,44,INK,500,1.35)}
   <rect x="80" y="${H-280}" rx="44" width="${cw}" height="88" fill="url(#${gid})"/>${T([b.cta||'Tìm hiểu ngay'],124,H-222,38,'#FFFFFF',700)}${T([hashtag||''],80,H-80,40,RED,600)}`;}
  return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(b.headline)}">${defs}${body}</svg>`;
}
function bannerArt(b,hashtag){return b.type==='img'?`<img src="${esc(b.url)}" alt="Banner tải lên">`:bannerSVG(b,hashtag);}
function bannerPng(b,hashtag,name){
  if(b.type==='img'){fetch(b.url).then(r=>r.blob()).then(bl=>saveFile(name+(bl.type.includes('png')?'.png':'.jpg'),bl)).catch(()=>toast('Không tải được ảnh.'));return;}
  const svg=bannerSVG(b,hashtag);const[W,H]=RATIOS[b.ratio||'1:1'];const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(img,0,0,W,H);c.toBlob(bl=>saveFile(name+'.png',bl),'image/png');};
  img.onerror=()=>saveFile(name+'.svg',svg,'image/svg+xml');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function localIdeas(d){const r=ui.ai.ratio;return[{headline:d.name||'Chiến dịch mới',sub:'Cùng Viettel Hà Nội lan tỏa đến mọi người',cta:'Tìm hiểu ngay',layout:'red',ratio:r},{headline:'Hà Nội kết nối nhanh hơn',sub:(d.content||'').split('.')[0].slice(0,80)||'Trải nghiệm dịch vụ mới của Viettel',cta:'Đăng ký ngay',layout:'white',ratio:r},{headline:'Viettel đồng hành mỗi ngày',sub:'Chia sẻ trải nghiệm của bạn với hashtag chiến dịch',cta:'Chia sẻ ngay',layout:'split',ratio:r},{headline:'Một chạm, cả thành phố',sub:'Mỗi bài đăng là một lời giới thiệu đáng tin cậy',cta:'Tham gia',layout:'red',ratio:r}];}
async function genAI(){
  const d=ui.camp;
  if(!sampleFn){ui.ai.results=localIdeas(d);render();return;}
  ui.ai.busy=true;render();
  try{
    const res=await sampleFn.json(`Bạn là copywriter của Viettel Hà Nội. Viết 4 phương án chữ cho banner mạng xã hội, tiếng Việt, chuẩn mực, không dùng emoji, không hứa hẹn số liệu không có trong mô tả.
Tên chiến dịch: ${d.name||''}
Nội dung phát động: ${d.content||''}
Yêu cầu thêm của quản lý: ${ui.ai.prompt||'(không có)'}
Trả về CHỈ một mảng JSON gồm 4 đối tượng {"headline": tối đa 8 từ, "sub": tối đa 16 từ, "cta": tối đa 3 từ, "layout": một trong "red","white","split"}, mỗi phương án dùng layout khác nhau nếu có thể.`,{modelTier:'quick'});
    const arr=Array.isArray(res)?res:(res&&res.items)||[];
    ui.ai.results=arr.slice(0,4).map(x=>({headline:String(x.headline||'').slice(0,80),sub:String(x.sub||'').slice(0,140),cta:String(x.cta||'').slice(0,24),layout:['red','white','split'].includes(x.layout)?x.layout:'red',ratio:ui.ai.ratio}));
    if(!ui.ai.results.length)throw{code:'empty'};
  }catch(e){if(e&&e.code==='not_granted')sampleFn=null;toast('AI chưa trả lời được ('+(e&&e.code||'lỗi')+'). Đã dùng gợi ý mẫu.');ui.ai.results=localIdeas(d);}
  ui.ai.busy=false;render();
}
async function uploadImgs(files){
  const d=ui.camp;const room=10-d.banners.length;if(room<=0){toast('Mỗi chiến dịch tối đa 10 banner.');return;}
  for(const f of Array.from(files).slice(0,room)){
    try{if(assets){const r=await assets.upload(f);d.banners.push({type:'img',url:r.url,id:r.id});}else{d.banners.push({type:'img',url:await downscale(f,640)});}}
    catch(e){toast('Không tải được '+f.name+' ('+(e&&e.code||'lỗi')+').');}
  }
  if(files.length>room)toast('Chỉ thêm '+room+' ảnh vì giới hạn 10 banner.');
  render();
}
function downscale(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78));};im.onerror=rej;im.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}

function submitPost(){
  const m=me(),s=ui.sub,c=S.campaigns[s.camp],msg=$('#subMsg');
  const bad=t=>{msg.textContent=t;msg.className='small down b';};
  if(!c)return bad('Chọn chiến dịch.');
  const links=$('#subLinks').value.split(/\s+/).map(x=>x.trim()).filter(Boolean);s.links=$('#subLinks').value;
  if(!links.length)return bad('Dán ít nhất một link bài đăng.');
  const wrong=links.filter(u=>!/^https?:\/\/\S+\.\S+/.test(u)||!PF_RE[s.pf].test(u));
  if(wrong.length)return bad('Link không đúng với kênh '+(s.pf==='fb'?'Facebook':'TikTok')+': '+wrong[0]);
  if(!$('#subOk').checked)return bad('Xác nhận bài để Công khai và có đủ hashtag.');
  const list=(S.posts[c.id]=S.posts[c.id]||[]);
  const dup=links.filter(u=>list.some(x=>x.url===u));if(dup.length)return bad('Link đã được nộp trước đó: '+dup[0]);
  const n=id=>+($(id)&&$(id).value)||0;

function campAgg(c,onlyDist){
  let ppl=peopleIn(c.districts||[]);if(onlyDist)ppl=ppl.filter(p=>p.dist===onlyDist);
  const codes=new Set(ppl.map(p=>p.code));const posts=(S.posts[c.id]||[]).filter(p=>p.grp!=='bk'&&codes.has(p.code));
  const per={};ppl.forEach(p=>per[p.code]={p,posts:0,fb:0,tt:0,likes:0,cmts:0,views:0,shares:0});
  posts.forEach(x=>{const o=per[x.code];if(!o)return;o.posts++;o[x.pf==='tt'?'tt':'fb']++;o.likes+=+x.likes||0;o.cmts+=+x.cmts||0;o.views+=+x.views||0;o.shares+=+x.shares||0;});
  const dist={};(c.districts||[]).forEach(d=>dist[d]={d,people:0,posted:0,posts:0,fb:0,tt:0,likes:0,cmts:0,views:0,shares:0});
  Object.values(per).forEach(o=>{const t=dist[o.p.dist];if(!t)return;t.people++;if(o.posts)t.posted++;['posts','fb','tt','likes','cmts','views','shares'].forEach(k=>t[k]+=o[k]);});
  return{ppl,posts,per:Object.values(per),dist:Object.values(dist).filter(x=>x.people)};
}

function importPosts(aoa){
  const c=S.campaigns[ui.rp.camp];if(!c)return;
  const hi=aoa.findIndex(r=>r.some(x=>/link|url|duong dan/.test(noDia(x))));if(hi<0){toast('Không tìm thấy cột Link trong file.');return;}
  const H=aoa[hi].map(h=>noDia(h));const col=(...ks)=>H.findIndex(h=>ks.some(k=>h.includes(k)));
  const iU=col('link','url','duong dan'),iC=col('noi dung','caption','hashtag','mo ta'),iL=col('like','thich','reaction'),iM=col('comment','binh luan'),iV=col('view','luot xem'),iS=col('share','chia se'),iP=col('nen tang','platform'),iN=col('ma nv','ma nhan vien','ma thanh vien');
  const mains=(c.hashtags||[]).map(h=>noDia(h));const list=(S.posts[c.id]=S.posts[c.id]||[]);let add=0,upd=0,skip=0;
  aoa.slice(hi+1).forEach(r=>{const url=String(r[iU]||'').trim();if(!url)return;const cap=iC>=0?String(r[iC]||''):'';
    const ex=list.findIndex(x=>x.url===url);
    if(ex>=0){const o=list[ex];if(iL>=0)o.likes=+r[iL]||0;if(iM>=0)o.cmts=+r[iM]||0;if(iV>=0)o.views=+r[iV]||0;if(iS>=0)o.shares=+r[iS]||0;upd++;return;}
    let code=null,grp='vt';const mb=cap.match(/#?VTHNBK([A-Z0-9]+)/i);const mt=mb?null:cap.match(/#?VTHN([A-Z]{3})([A-Z0-9]+)/i);
    if(mb){const fb=findBk(mb[1]);code=fb?fb.code:mb[1].toUpperCase();grp='bk';}else if(mt)code=mt[2].toUpperCase();else if(iN>=0&&r[iN]){code=String(r[iN]).trim().toUpperCase();if(!findByCode(code)&&findBk(code))grp='bk';}
    const p=code&&(grp==='bk'?findBk(code):findByCode(code));const okScope=p&&(grp==='bk'?!!c.booking:(c.districts||[]).includes(p.dist));
    if(!p||(cap&&mains.length&&!mains.every(h=>noDia(cap).includes(h)))||!okScope){skip++;return;}
    const pf=(iP>=0&&/tik/i.test(String(r[iP])))||/tiktok/i.test(url)?'tt':'fb';
    list.push({id:uid(),grp,code:p.code,pf,url,likes:+r[iL]||0,cmts:+r[iM]||0,views:+r[iV]||0,shares:+r[iS]||0,at:new Date().toISOString(),src:'file'});add++;});
  savePosts(c.id);toast('Thêm '+add+' bài, cập nhật số liệu '+upd+' bài đã nộp, bỏ qua '+skip+' dòng không hợp lệ.');render();
}
function simPosts(){
  const c=S.campaigns[ui.rp.camp];const ppl=peopleIn(c.districts||[]);if(!ppl.length&&!(c.booking&&(S.booking||[]).length)){toast('Chiến dịch chưa có người tham gia.');return;}
  const list=(S.posts[c.id]||[]).filter(p=>p.src==='manual');const seed=hashStr(c.id);
  ppl.forEach((p,i)=>{if(list.some(x=>x.code===p.code&&x.grp!=='bk'))return;const s=seed+i*31;const dr=.55+rnd(hashStr(p.dist))*.4;if(rnd(s)>dr)return;const n=1+Math.floor(rnd(s+1)*3);
    for(let k=0;k<n;k++){const tt=c.platforms==='tt'||(c.platforms!=='fb'&&rnd(s+k+2)<.45);const v=Math.round((tt?400:120)*(.3+rnd(s+k+3)*3));
      list.push({id:uid(),code:p.code,pf:tt?'tt':'fb',url:(tt?'https://www.tiktok.com/@':'https://www.facebook.com/')+noDia(p.name).replace(/\s/g,'')+'/posts/'+(s+k),likes:v,cmts:Math.round(v*(.08+rnd(s+k+4)*.12)),views:tt?v*(18+Math.round(rnd(s+k+5)*30)):v*6,shares:Math.round(v*.05*rnd(s+k+6)),at:new Date(Date.now()-rnd(s+k+7)*5*DAY).toISOString(),src:'sim'});}});
  if(c.booking)allBooking().forEach((p,i)=>{if(list.some(x=>x.code===p.code&&x.grp==='bk'))return;const s=seed+7777+i*37;if(rnd(s)>.72)return;const n=1+Math.floor(rnd(s+1)*3);
    for(let k=0;k<n;k++){const tt=c.platforms==='tt'||(c.platforms!=='fb'&&rnd(s+k+2)<.6);const v=Math.round((tt?900:300)*(.3+rnd(s+k+3)*3));
      list.push({id:uid(),grp:'bk',code:p.code,pf:tt?'tt':'fb',url:(tt?'https://www.tiktok.com/@':'https://www.facebook.com/')+noDia(p.name).replace(/\s/g,'')+'/posts/bk'+(s+k),likes:v,cmts:Math.round(v*(.1+rnd(s+k+4)*.15)),views:tt?v*(20+Math.round(rnd(s+k+5)*35)):v*7,shares:Math.round(v*.06*rnd(s+k+6)),at:new Date(Date.now()-rnd(s+k+7)*5*DAY).toISOString(),src:'sim'});}});
  S.posts[c.id]=list;savePosts(c.id);toast('Đã tạo dữ liệu mô phỏng. Bài người dùng tự nộp được giữ nguyên.');render();
}

function nextBkCode(list){let mx=0;(list||S.booking||[]).forEach(p=>{const m=String(p.code).match(/^BK(\d+)$/);if(m)mx=Math.max(mx,+m[1]);});return'BK'+String(mx+1).padStart(4,'0');}
function parseRowsBk(aoa){
  if(!aoa.length)return{ok:[],errs:[{row:0,msg:'File trống'}],grp:'bk'};
  const hi=aoa.findIndex(r=>r.filter(c=>{const k=mapHeader(c);return k&&k!=='dist';}).length>=2);
  if(hi<0)return{ok:[],errs:[{row:1,msg:'Không tìm thấy dòng tiêu đề. Cần các cột: Họ tên, Mã thành viên, Email, Link Facebook, Link TikTok.'}],grp:'bk'};
  const map=aoa[hi].map(mapHeader);const ok=[],errs=[],seen={};
  aoa.slice(hi+1).forEach((r,ix)=>{
    const o={};map.forEach((k,j)=>{if(k)o[k]=String(r[j]==null?'':r[j]).trim();});
    if(!Object.values(o).some(Boolean))return;
    const line=hi+ix+2,msgs=[];if(!o.name)msgs.push('thiếu họ tên');
    const code=(o.code||'').replace(/\s/g,'').toUpperCase();
    if(code&&!/^[A-Z0-9]+$/.test(code))msgs.push('mã thành viên chỉ gồm chữ và số');else if(code&&seen[code])msgs.push('trùng mã thành viên với dòng '+seen[code]);
    if(!o.email)msgs.push('thiếu email');else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email))msgs.push('email sai định dạng');
    if(o.fb&&!/facebook\.com|fb\.com|fb\.me/i.test(o.fb))msgs.push('link Facebook sai');
    if(o.tt&&!/tiktok\.com/i.test(o.tt))msgs.push('link TikTok sai');
    if(msgs.length){errs.push({row:line,msg:msgs.join(', '),name:o.name||''});return;}
    if(code)seen[code]=line;ok.push({grp:'bk',name:o.name,code,email:o.email.toLowerCase(),fb:o.fb||'',tt:o.tt||''});
  });
  return{ok,errs,grp:'bk'};
}
function applyImportBk(){
  const imp=ui.pp.imp;if(!imp||!imp.ok.length)return;
  const list=ui.pp.mode==='replace'?[]:(S.booking||[]).map(x=>Object.assign({},x));let gen=0;
  imp.ok.forEach(p=>{const ex=p.code?list.find(x=>x.code===p.code):list.find(x=>x.email===p.email);
    if(ex){Object.assign(ex,{name:p.name,email:p.email,fb:p.fb,tt:p.tt});return;}
    let code=p.code;if(!code){code=nextBkCode(list);gen++;}
    list.push({grp:'bk',name:p.name,code,email:p.email,fb:p.fb,tt:p.tt,addedAt:new Date().toISOString()});});
  S.booking=list;saveBooking();
  toast('Đã đồng bộ '+imp.ok.length+' thành viên'+(gen?', tự tạo '+gen+' mã thành viên':'')+'. Mã cá nhân đã được tạo.');
  ui.pp.imp=Object.assign({},imp,{done:true});render();
}

function saveBk(old){
  const v=id=>$(id).value.trim();const msg=$('#bfMsg');
  const res=parseRowsBk([TEMPLATE_HEAD_BK.slice(1),[v('#bfName'),v('#bfCode'),v('#bfEmail'),v('#bfFb'),v('#bfTt')]]);
  if(res.errs.length){msg.textContent='Cần sửa: '+res.errs[0].msg+'.';msg.className='small down b';return;}
  const p=res.ok[0];
  if(old){S.booking=(S.booking||[]).map(x=>x.code===old?Object.assign({},x,{name:p.name,email:p.email,fb:p.fb,tt:p.tt}):x);}
  else{if(p.code&&findBk(p.code)){msg.textContent='Mã thành viên này đã có trong danh sách.';msg.className='small down b';return;}
    p.code=p.code||nextBkCode();p.addedAt=new Date().toISOString();S.booking=(S.booking||[]).concat([p]);}
  saveBooking();closeDlg();toast('Đã lưu '+p.name+(old?'':', mã cá nhân '+tagOf(p)));render();
}
function seedBk(){
  const ho=['Nguyễn','Trần','Lê','Phạm','Hoàng','Vũ','Đỗ','Bùi'],ten=['Minh Anh','Bảo Ngọc','Gia Huy','Khánh Linh','Quốc Bảo','Thùy Dương','Hải Yến','Tuấn Kiệt','Mai Phương','Đức Mạnh'];
  const list=(S.booking||[]).slice();
  for(let i=0;i<40;i++){const name=ho[Math.floor(rnd(i*13)*ho.length)]+' '+ten[Math.floor(rnd(i*29+5)*ten.length)];const slug=noDia(name).replace(/\s+/g,'');const code=nextBkCode(list);
    list.push({grp:'bk',name,code,email:slug+code.slice(-2)+'@gmail.com',fb:'https://facebook.com/'+slug+code.slice(-2),tt:'https://tiktok.com/@'+slug+code.slice(-2),addedAt:new Date().toISOString()});}
  S.booking=list;saveBooking();toast('Đã nạp 40 thành viên Booking/Event mẫu.');render();
}

/* ================= Booking/Event: báo cáo ================= */
function campAggBk(c){
  const ppl=c.booking?allBooking():[];const codes=new Set(ppl.map(p=>p.code));
  const posts=(S.posts[c.id]||[]).filter(p=>p.grp==='bk'&&codes.has(p.code));
  const per={};ppl.forEach(p=>per[p.code]={p,posts:0,fb:0,tt:0,likes:0,cmts:0,views:0,shares:0});
  posts.forEach(x=>{const o=per[x.code];if(!o)return;o.posts++;o[x.pf==='tt'?'tt':'fb']++;o.likes+=+x.likes||0;o.cmts+=+x.cmts||0;o.views+=+x.views||0;o.shares+=+x.shares||0;});
  return{ppl,posts,per:Object.values(per),dist:[]};
}
function grpTot(A){
  const t={people:A.ppl.length,posted:A.per.filter(o=>o.posts).length,posts:A.posts.length,fb:0,tt:0,likes:0,cmts:0,views:0,shares:0};
  A.per.forEach(o=>['fb','tt','likes','cmts','views','shares'].forEach(k=>t[k]+=o[k]));
  t.eng=t.likes+t.cmts+t.shares;t.rate=t.people?t.posted/t.people:0;t.ppp=t.posted?t.posts/t.posted:0;t.epp=t.posts?t.eng/t.posts:0;t.vpp=t.posts?t.views/t.posts:0;t.ttShare=t.posts?t.tt/t.posts:0;return t;
}

function reportCmp(c){
  const V=grpTot(campAgg(c)),B=grpTot(campAggBk(c));
  const pc=v=>Math.round(v*100)+'%';
  const F={rate:pc,ttShare:pc,ppp:v=>(Math.round(v*10)/10).toString().replace('.',','),epp:v=>nf(v),vpp:v=>cf(v)};
  const K=[['people','Người tham gia'],['posted','Người đã đăng'],['rate','Tỷ lệ người đã đăng'],['posts','Số bài'],['ppp','Bài trên mỗi người đã đăng'],['likes','Lượt thích'],['cmts','Bình luận'],['shares','Chia sẻ'],['views','Lượt xem'],['eng','Tổng tương tác'],['epp','Tương tác mỗi bài'],['vpp','Lượt xem mỗi bài'],['ttShare','Tỷ trọng bài TikTok']];
  const rows=K.map(([k,l])=>{const a=V[k],b=B[k],t=a+b||1,f=F[k]||cf;return`<div class="h2h-row"><div class="a ${a>b?'win':''}">${f(a)}</div><div class="h2h-bar"><div class="lbl">${l}</div><div class="bar"><i class="ba" style="width:${a/t*100}%"></i><i class="bb" style="width:${b/t*100}%"></i></div></div><div class="b ${b>a?'win':''}">${f(b)}</div></div>`;}).join('');
  const totP=V.posts+B.posts,totE=V.eng+B.eng;
  AFTER.push(()=>drawCmp(c,V,B));
  const leg='<div class="legend"><span><i class="sw"></i>Nội bộ Viettel</span><span><i class="sw tt"></i>Booking/Event</span></div>';
  return`${c.booking?'':'<p class="note">Chiến dịch này chưa áp dụng cho Booking/Event nên số liệu nhóm Booking/Event bằng 0.</p>'}
  <section class="kpis"><div class="kpi hot"><div class="k-l">Tổng bài 2 nhóm</div><div class="k-v">${nf(totP)}</div><div class="k-d">${nf(totE)} tương tác</div></div>
  <div class="kpi"><div class="k-l">Nội bộ Viettel</div><div class="k-v">${nf(V.posts)} bài</div><div class="split"><i class="fb" style="width:${totP?V.posts/totP*100:0}%"></i><i class="tt" style="width:${totP?B.posts/totP*100:0}%"></i></div><div class="split-t"><span>${pct(V.posts,totP)} số bài</span><span>${pct(V.eng,totE)} tương tác</span></div></div>
  <div class="kpi"><div class="k-l">Booking/Event</div><div class="k-v">${nf(B.posts)} bài</div><div class="split"><i class="tt" style="width:${totP?B.posts/totP*100:0}%"></i></div><div class="split-t"><span>${pct(B.posts,totP)} số bài</span><span>${pct(B.eng,totE)} tương tác</span></div></div>
  <div class="kpi"><div class="k-l">Tương tác mỗi bài</div><div class="k-v">${nf(V.epp)} / ${nf(B.epp)}</div><div class="k-d flat">Nội bộ / Booking</div></div></section>
  <div class="grid2"><section class="panel"><div class="ph"><div><h2>Quy mô tham gia</h2><p class="hint">Người tham gia, người đã đăng và số bài</p></div></div>${leg}<div class="chart-box" style="height:280px"><canvas id="cmpScale" role="img" aria-label="Biểu đồ so sánh quy mô tham gia hai nhóm"></canvas></div></section>
  <section class="panel"><div class="ph"><div><h2>Tương tác</h2><p class="hint">Lượt thích, bình luận và chia sẻ</p></div></div>${leg}<div class="chart-box" style="height:280px"><canvas id="cmpEng" role="img" aria-label="Biểu đồ so sánh tương tác hai nhóm"></canvas></div></section></div>
  <div class="grid2"><section class="panel"><div class="ph"><div><h2>Số bài tích lũy theo ngày</h2><p class="hint">Tốc độ hưởng ứng của hai nhóm từ ngày phát động</p></div></div>${leg}<div class="chart-box" style="height:300px"><canvas id="cmpCum" role="img" aria-label="Biểu đồ số bài tích lũy theo ngày của hai nhóm"></canvas></div></section>
  <section class="panel"><div class="ph"><div><h2>So sánh từng chỉ số</h2><p class="hint">Bên thắng ở mỗi chỉ số được tô đỏ</p></div></div>
  <div class="h2h-row" style="border:0;padding-top:0"><div class="a" style="color:var(--red)">Nội bộ Viettel</div><div></div><div class="b" style="color:var(--tt-ink)">Booking/Event</div></div>${rows}</section></div>`;
}
function drawCmp(c,V,B){
  if(typeof Chart==='undefined')return;const muted=css('--muted'),line=css('--line'),tt=css('--tt');
  const bar=(id,labels,a,b)=>{const el=$('#'+id);if(!el)return;charts[id]=new Chart(el,{type:'bar',data:{labels,datasets:[{label:'Nội bộ Viettel',data:a,backgroundColor:x=>gradFill(x,false),borderRadius:6,barPercentage:.72},{label:'Booking/Event',data:b,backgroundColor:tt,borderRadius:6,barPercentage:.72}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:Object.assign(tip(),{callbacks:{label:x=>x.dataset.label+': '+nf(x.parsed.y)}})},scales:{x:{grid:{display:false},ticks:{color:muted,font:{weight:600}}},y:{grid:{color:line},border:{display:false},ticks:{color:muted,callback:v=>cf(v)}}}}});};
  bar('cmpScale',['Người tham gia','Người đã đăng','Số bài'],[V.people,V.posted,V.posts],[B.people,B.posted,B.posts]);
  bar('cmpEng',['Lượt thích','Bình luận','Chia sẻ'],[V.likes,V.cmts,V.shares],[B.likes,B.cmts,B.shares]);
  const s=isoToIdx(c.start),e=Math.max(s,Math.min(isoToIdx(c.end),TODAY));const days=[];for(let i=s;i<=e;i++)days.push(i);
  const A1=campAgg(c).posts,B1=campAggBk(c).posts;
  const cum=list=>{const by={};let pre=0;list.forEach(p=>{const d=Math.floor(Date.parse(p.at)/DAY);if(d<s)pre++;else by[d]=(by[d]||0)+1;});let acc=pre;return days.map(d=>{acc+=by[d]||0;return acc;});};
  const el=$('#cmpCum');if(!el)return;
  charts.cmpCum=new Chart(el,{type:'line',data:{labels:days.map(idxShort),datasets:[
    {label:'Nội bộ Viettel',data:cum(A1),borderColor:css('--red'),backgroundColor:x=>{const{ctx:g,chartArea}=x.chart;if(!chartArea)return'transparent';const gr=g.createLinearGradient(0,chartArea.top,0,chartArea.bottom);gr.addColorStop(0,'rgba('+css('--red-rgb')+',.18)');gr.addColorStop(1,'rgba('+css('--red-rgb')+',0)');return gr;},fill:true,tension:.3,pointRadius:days.length>40?0:2,borderWidth:2.5},
    {label:'Booking/Event',data:cum(B1),borderColor:tt,borderDash:[6,4],fill:false,tension:.3,pointRadius:days.length>40?0:2,borderWidth:2.5}]},
    options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:Object.assign(tip(),{callbacks:{label:x=>x.dataset.label+': '+nf(x.parsed.y)+' bài'}})},
      scales:{x:{grid:{display:false},ticks:{color:muted,maxRotation:0,autoSkip:true,maxTicksLimit:8}},y:{grid:{color:line},border:{display:false},ticks:{color:muted}}}}});
}

  delCamp:()=>openDlg(`<h2>Xóa chiến dịch này?</h2><p style="margin:0">Toàn bộ bài đăng đã ghi nhận của chiến dịch cũng bị xóa.</p><div class="acts"><button class="btn" data-act="closeDlg">Hủy</button><button class="btn pri" data-act="delCampOk">Xóa chiến dịch</button></div>`),

  dTog:el=>{readDraft();const d=ui.camp,v=el.dataset.v;d.districts=d.districts.includes(v)?d.districts.filter(x=>x!==v):d.districts.concat([v]);render();},
  dAll:()=>{readDraft();ui.camp.districts=D.map(d=>d.code);render();},
  dHas:()=>{readDraft();ui.camp.districts=D.filter(d=>(S.people[d.code]||[]).length).map(d=>d.code);render();},
  dNone:()=>{readDraft();ui.camp.districts=[];render();},
  genAI:()=>{readDraft();genAI();},
  useAI:el=>{readDraft();if(ui.camp.banners.length>=10){toast('Mỗi chiến dịch tối đa 10 banner.');return;}ui.camp.banners.push(Object.assign({type:'ai'},ui.ai.results[+el.dataset.i]));render();},
  rmBanner:el=>{readDraft();ui.camp.banners.splice(+el.dataset.i,1);render();},
  dlBanner:el=>{readDraft();bannerPng(ui.camp.banners[+el.dataset.i],(ui.camp.hashtags||[]).join(' '),'banner-'+(+el.dataset.i+1));},
  dlBannerC:el=>{const c=S.campaigns[el.dataset.id];bannerPng(c.banners[+el.dataset.i],(c.hashtags||[]).join(' '),'banner-'+(+el.dataset.i+1));},
  submitPost:submitPost,
  delMyPost:el=>{const cid=el.dataset.cid;S.posts[cid]=(S.posts[cid]||[]).filter(p=>!(p.id===el.dataset.id&&isMine(p,me())));savePosts(cid);toast('Đã rút bài.');render();},
  editPost:el=>openDlg(editPostForm(findPost(el.dataset.id))),
  savePostEdit:el=>{const p=findPost(el.dataset.id);p.likes=+$('#epL').value||0;p.cmts=+$('#epC').value||0;p.views=+$('#epV').value||0;p.shares=+$('#epS').value||0;savePosts(ui.rp.camp);closeDlg();toast('Đã cập nhật số liệu.');render();},
  delPost:el=>{const c=ui.rp.camp;S.posts[c]=(S.posts[c]||[]).filter(p=>p.id!==el.dataset.id);savePosts(c);toast('Đã xóa bài.');render();},
  simPosts:()=>{const c=S.campaigns[ui.rp.camp];if((S.posts[c.id]||[]).some(p=>p.src!=='manual')){openDlg(`<h2>Tạo lại dữ liệu mô phỏng?</h2><p style="margin:0">Bài mô phỏng và bài nhập từ file sẽ được thay mới. Bài người dùng tự nộp được giữ nguyên.</p><div class="acts"><button class="btn" data-act="closeDlg">Hủy</button><button class="btn pri" data-act="simOk">Tạo dữ liệu mô phỏng</button></div>`);return;}simPosts();},
  simOk:()=>{closeDlg();simPosts();},
  exportReport:exportReport,
  exportMissing:()=>{const c=S.campaigns[ui.rp.camp];const A=campAgg(c);saveXlsx('chua-dang-bai.xlsx',[{name:'Chưa đăng',rows:A.per.filter(o=>!o.posts&&(ui.rp.dist==='all'||o.p.dist===ui.rp.dist)).map((o,i)=>({'STT':i+1,'Họ tên':o.p.name,'Quận, huyện':DM[o.p.dist].name,'Mã NV':o.p.code,'Email':o.p.email,'Hashtag cá nhân':tagOf(o.p)}))}]);},
  remindNow:()=>remind(ui.rp.camp,'manual',ui.rp.grp==='bk'?'bk':'vt'),
  remind:el=>remind(el.dataset.id,el.dataset.kind),
  tog:el=>{const k=el.dataset.k;S.settings[k]=!S.settings[k];saveSettings();render();},
  addBk:()=>openDlg(personFormBk()),editBk:el=>openDlg(personFormBk(findBk(el.dataset.code))),saveBk:el=>saveBk(el.dataset.old),
  delBk:el=>{const p=findBk(el.dataset.code);openDlg(`<h2>Xóa ${esc(p.name)}?</h2><p style="margin:0">Thành viên này sẽ không còn trong danh sách Booking/Event và không được tính vào báo cáo.</p><div class="acts"><button class="btn" data-act="closeDlg">Hủy</button><button class="btn pri" data-act="delBkOk" data-code="${esc(p.code)}">Xóa thành viên</button></div>`);},
  delBkOk:el=>{S.booking=(S.booking||[]).filter(x=>x.code!==el.dataset.code);saveBooking();closeDlg();toast('Đã xóa thành viên.');render();},
  bpage:el=>{ui.pp.bpage+=+el.dataset.v;render();},seedBk:seedBk,
  exportMissingBk:()=>{const c=S.campaigns[ui.rp.camp];saveXlsx('booking-chua-dang.xlsx',[{name:'Chưa đăng',rows:campAggBk(c).per.filter(o=>!o.posts).map((o,i)=>({'STT':i+1,'Họ tên':o.p.name,'Mã thành viên':o.p.code,'Email':o.p.email,'Mã cá nhân':tagOf(o.p)}))}]);},
  resetTpl:()=>{S.settings.subject=DEFAULT_SETTINGS.subject;S.settings.body=DEFAULT_SETTINGS.body;saveSettings();render();}
};
const CHANGE={
  dsel:el=>{const c=ui.ch;const v=el.value;c.dists=el.checked?c.dists.concat([v]):c.dists.filter(x=>x!==v);c.dists=D.map(d=>d.code).filter(x=>c.dists.includes(x));const keep=true;render();if(keep){const dd=$('#distDD');if(dd)dd.open=true;}},
  mTog:el=>{const c=ui.ch,v=el.value;if(el.checked){if(c.multi.length>=5){el.checked=false;toast('Chọn tối đa 5 đơn vị.');return;}c.multi=c.multi.concat([v]);}else c.multi=c.multi.filter(x=>x!==v);render();},
  dTog:el=>ACT.dTog(el),
  bkTog:el=>{readDraft();ui.camp.booking=el.checked;render();},
  subPf:el=>{ui.sub.pf=el.value;const l=$('#subLinks');if(l)ui.sub.links=l.value;render();}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const el=e.target.closest&&e.target.closest('tr[data-act="heatGo"]');if(el)ACT.heatGo(el);}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.matches('input[data-act]')){(CHANGE[el.dataset.act]||ACT[el.dataset.act])(el);return;}
  if(el.dataset.chf){const k=el.dataset.chf,c=ui.ch;
    if(k==='preset'){c.preset=el.value;if(c.preset!=='custom')applyPreset(c.preset);}
    else if(k==='cmp'){c.cmp=el.value;if(c.cmp==='custom'){const L=c.b-c.a+1;c.ca=c.a-L;c.cb=c.a-1;}}
    else if(k==='a'||k==='b'){const v=posOf(el.value);if(!isNaN(v)){c[k]=Math.max(365,Math.min(N-1,v));if(c.b<c.a){const t=c.a;c.a=c.b;c.b=t;}}}
    else if(k==='ca'||k==='cb'){const v=posOf(el.value);if(!isNaN(v))c[k]=Math.max(0,Math.min(N-1,v));}
    else c[k]=el.value;
    render();return;}
  if(el.dataset.bind&&!el.dataset.live){readDraft();setPath(el.dataset.bind,el.value);if(el.dataset.bind==='pp.dist')ui.pp.page=0;if(el.dataset.bind==='sub.camp'){const l=$('#subLinks');if(l)ui.sub.links=l.value;}render();}
  if(el.dataset.set){const k=el.dataset.set;S.settings[k]=el.type==='number'?Math.max(1,+el.value||1):el.value;saveSettings();render();}
  if(el.dataset.draft)readDraft();
});
let liveT;
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.live&&el.dataset.bind){clearTimeout(liveT);liveT=setTimeout(()=>{setPath(el.dataset.bind,el.value);if(el.dataset.bind==='pp.q')ui.pp.page=0;const pos=el.selectionStart,b=el.dataset.bind;render();const n=document.querySelector('[data-bind="'+b+'"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}},250);}
  if(el.id==='gsLink')ui.pp.gsLink=el.value;if(el.id==='gsLinkBk')ui.pp.gsLinkBk=el.value;});
document.addEventListener('click',e=>{const dd=$('#distDD');if(dd&&dd.open&&!dd.contains(e.target))dd.open=false;});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(!window.XLSX){toast('Thư viện Excel chưa tải xong, thử lại sau vài giây.');return;}
  const fr=new FileReader();fr.onload=()=>{try{const wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
    if(e.target.dataset.for==='posts')importPosts(aoa);else{ui.pp.imp=Object.assign((ui.pp.grp==='bk'?parseRowsBk:parseRows)(aoa),{src:f.name});render();}}catch(err){toast('Không đọc được file. Kiểm tra lại định dạng .xlsx hoặc .csv.');}};fr.readAsArrayBuffer(f);});
$('#imgIn').addEventListener('change',e=>{if(e.target.files.length&&ui.camp)uploadImgs(e.target.files);});
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))closeDlg();});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(ui.view==='channels')Object.values(charts).forEach(c=>{try{c.resize();}catch(e){}});},200);});
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(ui.view==='channels')render();});

/* ================= Khởi động ================= */
prefLoad();lsLoad();if(STANDALONE){gdRestore();if(gdCid())gdLoad().catch(()=>{});}render();
window.addEventListener('load',()=>{if(ui.view==='channels')render();});
(async()=>{
  if(!window.claude||!window.claude.use)return;
  const get=n=>window.claude.use(n).catch(()=>null);
  const[d,a,s,dl,mc]=await Promise.all([get('db'),get('assets'),get('sample'),get('downloads'),get('mcp')]);
  assets=a;sampleFn=s;downloads=dl;mcp=mc;
  if(d){db=d;shared=true;S.people={};S.booking=[];S.campaigns={};S.posts={};
    const err=e=>toast('Mất kết nối dữ liệu dùng chung ('+(e&&e.code||'lỗi')+'). Tải lại trang để thử lại.');
    db.collection('participants').onSnapshot(q=>{const o={};q.docs.forEach(x=>{const v=x.data();o[x.id]=v&&Array.isArray(v.list)?clone(v.list):[];});S.people=o;remoteRender();},err);
    db.collection('campaigns').onSnapshot(q=>{const o={};q.docs.forEach(x=>o[x.id]=clone(x.data()));S.campaigns=o;remoteRender();},err);
    db.collection('posts').onSnapshot(q=>{const o={};q.docs.forEach(x=>{const v=x.data();o[x.id]=v&&Array.isArray(v.list)?clone(v.list):[];});S.posts=o;remoteRender();},err);
    db.doc('booking/members').onSnapshot(x=>{const v=x.exists?x.data():null;S.booking=v&&Array.isArray(v.list)?clone(v.list):[];remoteRender();},err);
    db.doc('app/settings').onSnapshot(x=>{S.settings=Object.assign(clone(DEFAULT_SETTINGS),x.exists?clone(x.data()):{});remoteRender();},err);
  }
  render();
})();
})();
</script>
</body>
</html>
